# Local development / test infrastructure. The app and worker run on the host (npm run dev / npm run worker).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db/docker-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./scripts/db/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql.inc:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
volumes:
  pgdata:
